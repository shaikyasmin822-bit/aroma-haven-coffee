
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Haven - Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(ellipse at 10% 10%, #d47b25, transparent 35%),
                linear-gradient(120deg, #f8ead8, #fffaf2, #f5e5d2);
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1250px;
            min-height: 690px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            background: rgba(255,255,255,0.92);
            border-radius: 30px;
            box-shadow: 0 20px 55px rgba(76,43,20,0.17);
            overflow: hidden;
            position: relative;
        }

        .coffee-side {
            height: 100%;
            min-height: 690px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
            background: linear-gradient(145deg, #c77a28, #8c471d);
        }

        .coffee-photo {
            width: 100%;
            height: 590px;
            object-fit: cover;
            border-radius: 48% 48% 42% 42%;
            border: 12px solid #fff2df;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .login-side {
            padding: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
        }

        .coffee-logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 43px;
            color: #744329;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin: 15px 0 38px;
            font-size: 19px;
        }

        .form-input {
            width: 100%;
            padding: 17px;
            margin-bottom: 20px;
            border: 1px solid #e4d7ca;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            background: #fffaf5;
            transition: 0.3s;
        }

        .form-input:focus {
            border-color: #a65c2b;
            box-shadow: 0 0 0 3px rgba(166,92,43,0.12);
        }

        button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(120deg, #995321, #713d20);
            color: white;
            font-size: 17px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(113,61,32,0.25);
        }

        #loginMessage {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            min-height: 24px;
        }

        @media(max-width: 850px) {
            body {
                padding: 18px;
            }

            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .coffee-side {
                min-height: 300px;
                padding: 25px;
            }

            .coffee-photo {
                height: 260px;
                max-width: 420px;
            }

            .login-side {
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }
        }

        @media(max-width: 450px) {
            .coffee-side {
                min-height: 230px;
            }

            .coffee-photo {
                height: 200px;
            }

            .login-side {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="coffee-side">
            <img
                src="coffee-login-photo.png.png"
                class="coffee-photo"
                alt="Barista preparing fresh espresso coffee"
            >
        </div>

        <div class="login-side">
            <div class="login-box">

                <div class="coffee-logo">☕</div>

                <h1>Aroma Haven</h1>
                <p class="subtitle">Welcome Back! Admin Login</p>

                <form id="loginForm">

                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Admin Username"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Admin Password"
                        required
                    >

                    <button type="submit">Login</button>

                    <p id="loginMessage"></p>

                </form>

            </div>
        </div>

    </div>

    <script src="admin-login.js"></script>

</body>
</html>
